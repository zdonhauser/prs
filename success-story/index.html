<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PRS Success Story Builder</title>
  <link rel="icon" href="../icon-192.png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <script>
    // One suite-wide service worker at the site root, covering every tool
    // page. The site may be served from the repo root or the staging
    // subdirectory, so derive the root from the current path rather than
    // hardcoding it.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const root = location.pathname.replace(/(success-story|event-flyer|template-creator)\/$/, '')
        navigator.serviceWorker.register(root + 'sw.js', { scope: root })
      })
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/entries/successStory.tsx"></script>
</body>
</html>
