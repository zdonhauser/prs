<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PRS Template Creator</title>
  <link rel="icon" href="../icon-192.png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <script>
    // One suite-wide service worker at the site root, covering every tool
    // page. The site may be served from the repo root or the staging
    // subdirectory, so derive the root from the current path rather than
    // hardcoding it.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const root = location.pathname.replace(/(success-story|event-flyer|template-creator)\/$/, '')
        // A new service worker activates immediately (workbox skipWaiting +
        // clientsClaim) and then takes over this already-loaded page, whose
        // HTML and JS came from the previous build. Reload once so the page
        // matches the assets the new worker will serve — without this, a
        // lazily-imported chunk can 404 after the old precache is cleaned up.
        // Guarded on there having been a controller already, so a first-ever
        // visit (where claiming is expected) doesn't reload for nothing.
        let reloading = false
        const hadController = !!navigator.serviceWorker.controller
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (hadController && !reloading) {
            reloading = true
            location.reload()
          }
        })
        navigator.serviceWorker.register(root + 'sw.js', { scope: root })
      })
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/entries/templateCreator.tsx"></script>
</body>
</html>
