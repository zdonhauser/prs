<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>PRS Event Flyer Builder</title>
  <link rel="icon" href="../icon-192.png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <script>
    // One suite-wide service worker at the site root, covering every tool
    // page. The site may be served from the repo root or the staging
    // subdirectory, so derive the root from the current path rather than
    // hardcoding it.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const root = location.pathname.replace(/(success-story|event-flyer|template-creator)\/$/, '')
        navigator.serviceWorker.register(root + 'sw.js', { scope: root })
      })
    }
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #2d3748;
    }
    p { text-align: center; padding: 32px; }
  </style>
</head>
